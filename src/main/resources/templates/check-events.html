<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${check.name} + ' — history — NoShow'">NoShow</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            max-width: 820px; margin: 0 auto; padding: 2rem 1.25rem; line-height: 1.5;
        }
        a.back { color: #888; text-decoration: none; font-size: .9rem; }
        a.back:hover { text-decoration: underline; }
        h1 { margin: .5rem 0 .25rem; }
        .sub { color: #888; margin: 0 0 2rem; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: .6rem .5rem; border-bottom: 1px solid #ddd3; }
        th { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: #888; }
        .status { font-weight: 600; font-size: .78rem; padding: .1rem .45rem; border-radius: 999px; }
        .status-UP { background: #e5f4e4; color: #1a7f37; }
        .status-NEW { background: #eee; color: #555; }
        .status-LATE { background: #f9eeda; color: #9a6700; }
        .status-DOWN { background: #fbebeb; color: #c0392b; }
        .status-PAUSED { background: #eee; color: #777; }
        .arrow { color: #999; padding: 0 .35rem; }
        .muted { color: #999; }
        .empty { color: #999; font-style: italic; }
    </style>
</head>
<body>
    <a class="back" href="/">← All checks</a>
    <h1 th:text="${check.name}">backup-nightly</h1>
    <p class="sub">
        Current status:
        <span class="status" th:classappend="'status-' + ${check.status}" th:text="${check.status}">UP</span>
    </p>

    <h2>Status history</h2>
    <table>
        <thead>
            <tr>
                <th>When</th>
                <th>Change</th>
                <th>Reason</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${events.isEmpty()}">
                <td colspan="3" class="empty">No status changes yet.</td>
            </tr>
            <tr th:each="e : ${events}">
                <td th:text="${e.at}">—</td>
                <td>
                    <span class="status" th:classappend="'status-' + ${e.fromStatus}" th:text="${e.fromStatus}">UP</span>
                    <span class="arrow">→</span>
                    <span class="status" th:classappend="'status-' + ${e.toStatus}" th:text="${e.toStatus}">DOWN</span>
                </td>
                <td class="muted" th:text="${e.reason}">evaluator</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
