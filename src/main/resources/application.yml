spring:
  application:
    name: noshow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/noshow}
    username: ${DB_USER:noshow}
    password: ${DB_PASSWORD:noshow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

noshow:
  evaluator:
    # How often the late-detection sweep runs, in milliseconds.
    interval-ms: ${EVALUATOR_INTERVAL_MS:30000}
  alerts:
    # Where alert emails go. Single address for now; per-account in M4.
    recipient: ${ALERT_RECIPIENT:}
