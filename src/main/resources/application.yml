spring:
  application:
    name: noshow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/noshow}
    username: ${DB_USER:noshow}
    password: ${DB_PASSWORD:noshow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    # Timeouts so a stalled SMTP server fails fast instead of holding a
    # delivery thread. These apply only when spring.mail.host is configured.
    properties:
      mail:
        smtp:
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${PORT:8080}

noshow:
  evaluator:
    # How often the late-detection sweep runs, in milliseconds.
    interval-ms: ${EVALUATOR_INTERVAL_MS:30000}
  alerts:
    # Where alert emails go. Single address for now; per-account in M4.
    recipient: ${ALERT_RECIPIENT:}
    # From address on alert emails.
    from: ${ALERT_FROM:noreply@noshow.local}
  outbox:
    # How often the delivery worker runs, in milliseconds.
    interval-ms: ${OUTBOX_INTERVAL_MS:15000}
    # Delivery retries: attempts before giving up, and exponential backoff bounds.
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:5}
    base-backoff-ms: ${OUTBOX_BASE_BACKOFF_MS:60000}
    max-backoff-ms: ${OUTBOX_MAX_BACKOFF_MS:3600000}

# Email delivery is enabled only when SMTP is configured, e.g.:
#   SPRING_MAIL_HOST=smtp.example.com SPRING_MAIL_PORT=587
#   SPRING_MAIL_USERNAME=... SPRING_MAIL_PASSWORD=...
# Without spring.mail.host set, no email sender is created and alerts wait in
# the outbox.
